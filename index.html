<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parvana — Cuisine d'Afghanistan & d'Asie Centrale · Nantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --lapis: #1b2a4e;          /* deep indigo / lapis lazuli */
    --lapis-deep: #121d38;
    --lapis-soft: #2c3e6b;
    --cream: #f3ebdc;          /* warm parchment */
    --cream-soft: #ece2cf;
    --cream-deep: #e0d3b8;
    --saffron: #d99a2b;        /* saffron gold */
    --saffron-deep: #b87d18;
    --pomegranate: #8b2236;    /* pomegranate red */
    --ink: #1a1410;            /* warm near-black */
    --ink-soft: #3d322a;
    --rose-dust: #c9806f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  .serif { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; }
  .serif-it { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 400; }
  .persian { font-family: 'Vazirmatn', sans-serif; direction: rtl; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

  /* Textile geometric border — built from diamond + dot primitives */
  .textile-border {
    height: 22px;
    background-image:
      radial-gradient(circle at 50% 50%, currentColor 1.2px, transparent 1.6px),
      linear-gradient(45deg, transparent 46%, currentColor 46% 54%, transparent 54%),
      linear-gradient(-45deg, transparent 46%, currentColor 46% 54%, transparent 54%);
    background-size: 28px 22px, 28px 22px, 28px 22px;
    background-position: 14px 11px, 0 0, 0 0;
    background-repeat: repeat-x;
    opacity: 0.65;
  }

  /* Subtle vertical textile band */
  .textile-band {
    background-image:
      repeating-linear-gradient(0deg, transparent 0 18px, currentColor 18px 18.5px, transparent 18.5px 36px),
      radial-gradient(circle at 50% 9px, currentColor 1.2px, transparent 1.6px);
    background-size: 100% 36px, 12px 36px;
    opacity: 0.18;
  }

  /* Image placeholder */
  .ph {
    position: relative;
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.04) 0 8px, transparent 8px 16px),
      var(--cream-soft);
    border: 1px solid rgba(26,20,16,0.12);
    overflow: hidden;
  }
  .ph.dark {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 8px, transparent 8px 16px),
      var(--lapis-soft);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--cream);
  }
  .ph-label {
    position: absolute; left: 16px; bottom: 14px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--cream);
    padding: 4px 8px; border: 1px solid rgba(26,20,16,0.15);
  }
  .ph.dark .ph-label { color: var(--cream); background: rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.18); }

  /* Smooth fade-in on scroll */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 14px 26px;
    font-family: 'Manrope', sans-serif;
    font-weight: 500; font-size: 13px;
    letter-spacing: 0.12em; text-transform: uppercase;
    text-decoration: none;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(.2,.7,.2,1);
  }
  .btn:hover { background: currentColor; }
  .btn:hover > * { color: var(--cream); }
  .btn.solid { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .btn.solid:hover { background: var(--lapis); border-color: var(--lapis); }
  .btn .arrow { transition: transform 0.4s; }
  .btn:hover .arrow { transform: translateX(4px); }

  /* Eyebrow */
  .eyebrow {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 14px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ""; display: inline-block; width: 28px; height: 1px; background: currentColor; opacity: 0.5;
  }

  /* Section */
  section { position: relative; }

  .container { max-width: 1320px; margin: 0 auto; padding: 0 56px; }
  @media (max-width: 720px) { .container { padding: 0 24px; } }

  /* Selection */
  ::selection { background: var(--saffron); color: var(--ink); }

  /* Form */
  input, select, textarea {
    font-family: inherit; font-size: 15px;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(26,20,16,0.3);
    padding: 14px 0;
    color: var(--ink);
    outline: none;
    width: 100%;
    transition: border-color 0.3s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--saffron); }
  input::placeholder, textarea::placeholder { color: rgba(26,20,16,0.4); }

  /* Marquee */
  .marquee { display: flex; gap: 64px; white-space: nowrap; animation: marquee 60s linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Header */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 22px 56px;
    display: flex; align-items: center; justify-content: space-between;
    transition: all 0.5s cubic-bezier(.2,.7,.2,1);
    color: var(--cream);
    mix-blend-mode: difference;
  }
  .nav.scrolled {
    padding: 14px 56px;
    background: rgba(243,235,220,0.92);
    backdrop-filter: blur(14px);
    color: var(--ink);
    mix-blend-mode: normal;
    border-bottom: 1px solid rgba(26,20,16,0.08);
  }
  @media (max-width: 720px) { .nav, .nav.scrolled { padding-left: 24px; padding-right: 24px; } }
  .nav-links { display: flex; gap: 32px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
  .nav-links a { color: inherit; text-decoration: none; opacity: 0.8; transition: opacity 0.3s; position: relative; }
  .nav-links a:hover { opacity: 1; }
  .nav-links a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform 0.4s; }
  .nav-links a:hover::after { transform: scaleX(1); }
  @media (max-width: 880px) { .nav-links { display: none; } }

  .wordmark { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 24px; letter-spacing: 0.02em; }

  /* Hero butterfly — simple silhouette built from diamond/circle primitives via CSS */
  .butterfly {
    position: relative; width: 64px; height: 56px;
  }

  /* Layout helpers */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  @media (max-width: 920px) { .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 40px; } }

  .pill { display: inline-block; padding: 4px 12px; border: 1px solid currentColor; border-radius: 999px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; white-space: nowrap; }
</style>
</head>
